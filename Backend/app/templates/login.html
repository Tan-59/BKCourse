<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex justify-center items-start min-h-screen pt-16">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-slate-200">

        <h2 class="text-2xl font-semibold text-blue-600 text-center mb-6 flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i>
            Đăng nhập
        </h2>

        <form id="loginForm" method="post" class="space-y-5">

            <!-- Email -->
            <div>
                <label class="block font-semibold mb-1 text-slate-700">Email</label>
                <input 
                    id="email"
                    type="text" 
                    name="email"
                    placeholder="Nhập email"
                    required
                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-300 outline-none"
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block font-semibold mb-1 text-slate-700">Mật khẩu</label>
                <input 
                    id="password"
                    type="password" 
                    name="password" 
                    placeholder="Nhập mật khẩu"
                    required
                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-300 outline-none"
                >
            </div>

            <button 
                type="submit"
                class="w-full py-3 bg-blue-600 text-white rounded-lg text-lg font-medium hover:bg-blue-700 transition"
            >
                <i class="fa-solid fa-check mr-2"></i> Đăng nhập
            </button>
        </form>

        <div class="text-center mt-5 text-slate-600">
            Chưa có tài khoản?
            <a href="/register" class="text-blue-600 font-semibold hover:underline">Đăng ký ngay</a>
        </div>
    </div>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
