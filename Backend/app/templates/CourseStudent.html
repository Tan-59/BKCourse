<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses | Lecturer | BKCourse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  {% extends "layout.html" %}
  {% block content %}

  <!-- Main content -->
  <main class="pt-28 max-w-7xl mx-auto px-4">

    <!-- Filter and Course List -->
    <section class="bg-gray-200 p-4 rounded-md mb-6">

    <!-- Title moved to the top inside the same section -->
    <h2 class="font-bold text-xl mb-4">Khóa học của tôi</h2>

    <!-- Search + Filters -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        
        <!-- Search box -->
        <input
        id="searchCourse"
        type="text"
        placeholder="Tìm khóa học..."
        class="w-full md:w-1/2 px-4 py-2 rounded-full border border-gray-300
                focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
        />

        <!-- Filters -->
        <div class="flex flex-col md:flex-row items-center gap-4">
        
        <select
            id="filterTopic"
            class="px-4 py-2 rounded-lg bg-white border border-gray-300 shadow-sm 
                focus:outline-none focus:ring-2 focus:ring-blue-400 transition
                w-full md:w-auto"
        >
            <option value="All">Tất cả chủ đề</option>
        </select>

        <div class="flex flex-col md:flex-row items-center gap-1 w-full md:w-auto">
            <span class="text-gray-700 font-medium">Sắp xếp theo:</span>
            <select
            id="sortOrder"
            class="px-2 py-2 rounded-lg bg-white border border-gray-300 shadow-sm 
                    focus:outline-none focus:ring-2 focus:ring-blue-400 transition
                    w-full md:w-auto"
            >
            <option value="stars">Đánh giá cao nhất</option>
            <option value="enrollments">Số lượng học viên</option>
            <option value="newest">Mới nhất</option>
            </select>
        </div>

        <button
            id="btnFilter"
            class="bg-blue-600 text-white px-5 py-2 rounded-lg shadow
                hover:bg-blue-700 transition w-full md:w-auto"
        >
            Lọc
        </button>

        </div>
    </div>

    </section>


    <!-- Course List -->
    <section id="courseList" class="flex flex-col gap-6 bg-gray-200 p-4 rounded-md mb-16"></section>
  </main>

  <!-- Modal -->
  <div id="courseModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl my-8 mx-4 max-h-screen overflow-y-auto">
      <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center">
        <h2 id="modalCourseName" class="text-2xl font-bold"></h2>
        <span id="closeModal" class="cursor-pointer text-3xl hover:text-gray-600">&times;</span>
      </div>

      <div class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <p class="text-gray-700 text-lg" id="modalCourseDescription"></p>
            <div class="mt-4 space-y-2">
              <p><strong>Giảng viên:</strong> <span id="modalLecturer" class="text-blue-600"></span></p>
              <p><strong>Đánh giá trung bình:</strong> <span id="modalRating" class="text-yellow-600 font-bold text-xl"></span>/5</p>
              <p><strong>Học viên:</strong> <span id="modalEnroll" class="font-medium"></span></p>
              <p><strong>Ngày tạo:</strong> <span id="modalDate"></span></p>
            </div>
          </div>

          <!-- Form thêm Review -->
          <div id="reviewFormContainer" class="hidden">
            <div class="bg-gray-50 p-5 rounded-lg border">
              <h3 class="font-bold text-lg mb-3">Đánh giá khóa học</h3>
              <div class="flex gap-2 mb-3">
                <!--[1 to 5] sao -->
                <div id="starRating" class="flex text-3xl cursor-pointer">
                  <span class="star" data-value="1">★</span>
                  <span class="star" data-value="2">★</span>
                  <span class="star" data-value="3">★</span>
                  <span class="star" data-value="4">★</span>
                  <span class="star" data-value="5">★</span>
                </div>
              </div>
              <textarea id="reviewContent" placeholder="Chia sẻ trải nghiệm của bạn..." class="w-full p-3 border rounded-lg resize-none" rows="3"></textarea>
              <button id="submitReview" class="mt-3 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                Gửi đánh giá
              </button>
            </div>
          </div>
        </div>

        <!-- Danh sách Reviews -->
        <div class="border-t pt-6">
          <h3 class="font-bold text-xl mb-4">Đánh giá từ học viên (<span id="reviewCount">0</span>)</h3>
          <div id="reviewsList" class="space-y-4">
            <!-- Reviews sẽ được render bằng JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/CourseStudent.js') }}"></script>
  <script src="{{ url_for('static', filename='js/review.js') }}"></script>
  <script>
    const modal = document.getElementById('courseModal');
    const modalContent = document.getElementById('modalContent');

    function openModalAnim() {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modalContent.classList.remove('scale-95', 'opacity-0');
      }, 10);
    }

    function closeModalAnim() {
      modalContent.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    document.getElementById('closeModal').onclick = closeModalAnim;

    const oldOpenModal = window.openModal;
    window.openModal = function(course) {
      oldOpenModal(course);
      openModalAnim();
    }
  </script>
  {% endblock %}
</body>
</html>
