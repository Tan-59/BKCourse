<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center pt-10">

<div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg">
    <h2 class="text-center text-2xl font-bold text-blue-600 mb-6">
        <i class="fa-solid fa-user-plus"></i> Đăng ký
    </h2>

    <form id="registerForm" class="space-y-4">

        <!-- Họ và Tên tách ra -->
        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col">
                <label class="font-semibold text-gray-700"><i class="fa-solid fa-id-card"></i> Họ</label>
                <input type="text" id="firstName" placeholder="Nhập họ" required 
                    class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex flex-col">
                <label class="font-semibold text-gray-700"><i class="fa-solid fa-id-card"></i> Tên</label>
                <input type="text" id="lastName" placeholder="Nhập tên" required 
                    class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <div class="flex flex-col">
            <label class="font-semibold text-gray-700"><i class="fa-solid fa-lock"></i> Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu" required
                class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex flex-col">
            <label class="font-semibold text-gray-700"><i class="fa-solid fa-lock"></i> Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required
                class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex flex-col">
            <label class="font-semibold text-gray-700"><i class="fa-solid fa-users"></i> Vai trò</label>
            <select id="role" required
                class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
                <option value="">-- Chọn vai trò --</option>
                <option value="student">🎓 Học viên</option>
                <option value="lecturer">👨‍🏫 Giảng viên</option>
            </select>
        </div>

        <div class="flex flex-col">
            <label class="font-semibold text-gray-700"><i class="fa-solid fa-envelope"></i> Email</label>
            <input type="email" id="email" placeholder="Nhập email" required
                class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex flex-col">
            <label class="font-semibold text-gray-700"><i class="fa-solid fa-phone"></i> Số điện thoại</label>
            <input type="text" id="phone" placeholder="Nhập số điện thoại" required
                class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500">
        </div>

        <button type="submit" 
            class="w-full bg-blue-600 text-white p-3 rounded-lg text-lg font-semibold hover:bg-blue-700 transition-colors">
            <i class="fa-solid fa-check"></i> Đăng ký
        </button>
    </form>

    <div class="text-center mt-4">
        Đã có tài khoản? <a href="" class="text-blue-600 hover:underline">Đăng nhập</a>
    </div>
</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
