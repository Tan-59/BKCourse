<!-- Course.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link rel="stylesheet" href="styles/Course.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="flex flex-col justify-center gap-4">
    <header class="text-black text-center">
        <nav class="bg-[#0078FF] text-white w-full flex items-center justify-center py-1">
            <div class="flex w-full items-center">
                <h1 class="font-bold px-5">BKCourse</h1>
                <ul class="list-none flex w-full justify-around py-3">
                    <li>
                        <a href="#" class="text-white no-underline flex flex-col items-center justify-center text-[16px] gap-[4px] hover:bg-white/10">
                            <i class="fa-solid fa-house"></i>
                            <span>Trang chủ</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="text-white no-underline flex flex-col items-center justify-center text-[16px] gap-[4px] hover:bg-white/10">
                            <i class="fa-solid fa-book"></i>
                            <span>Khóa học</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="text-white no-underline flex flex-col items-center justify-center text-[16px] gap-[4px] hover:bg-white/10">
                            <i class="fa-solid fa-comments"></i>
                            <span>Diễn đàn</span>
                        </a>
                    </li>
                </ul>
                
            </div>
        </nav>
    </header>
    <div class="flex flex-col justify-center items-center bg-[#f6f6f6] w-[1000px] mx-auto rounded-[5px]">
        <div class="flex gap-4 w-full my-2 justify-center">
            <h1 class="font-bold text-lg">Course</h1>
            <input
                type="text"
                placeholder="Tìm khóa học..."
                class="w-2/3 px-3 py-1 border-2 border-[#dfeeff] rounded-[32px] font-semibold text-xs"
            />
        </div>
        
        <section id="filterBar" class="flex gap-2.5 p-2 justify-around w-full">
            <select id="filterStatus" class="border-[1px] border-[#e7e7e7] rounded px-2 py-1 bg-white font-thin">
                <option value="All">Tất cả</option>
                <option value="Public">Đã tham gia</option>
                <option value="Private">Chưa tham gia</option>
            </select>

            <select id="filterTopic" class="border-[1px] border-[#e7e7e7] rounded px-2 py-1 bg-white font-thin">
                <option value="All">Tất cả chủ đề</option>
            </select>

            <select id="sortOrder" class="border-[1px] border-[#e7e7e7] rounded px-2 py-1 bg-white font-thin">
                <option value="name_asc">Tên ↑</option>
                <option value="name_desc">Tên ↓</option>
                <option value="date_desc">Mới nhất</option>
                <option value="date_asc">Cũ nhất</option>
            </select>
        </section>
    </div>
    


    <main id="courseList"
      class="flex flex-col justify-center items-center bg-[#f6f6f6] w-[1000px] mx-auto rounded-[5px] gap-4 py-4">
    </main>


    <div id="courseModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden">
        <div class="bg-white p-5 rounded-md w-[800px] relative">
            <span id="closeModal" class="absolute top-2 right-2 cursor-pointer text-xl">&times;</span>
            <h2 id="modalCourseName" class="font-bold text-lg mb-2"></h2>
            <p id="modalCourseDescription" class="text-sm text-gray-700 mb-2"></p>
            <p><strong>Trạng thái:</strong> <span id="modalStatus"></span></p>
            <h3 class="font-semibold mt-4 mb-2">Nội dung khóa học</h3>
            <ul id="modalContents" class="list-disc list-inside"></ul>
        </div>
    </div>


    <script src="scripts/Course.js"></script>
</body>
</html>
